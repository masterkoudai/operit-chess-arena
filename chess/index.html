<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>国际象棋 · 陪你下一局</title>
<link rel="stylesheet" href="../assets/style.css">
<script src="../assets/theme.js"></script>
</head>
<body>
<div class="topbar">
  <span class="seal">棋</span>
  <div class="logo">Operit <span>棋院</span></div>
  <a class="btn ghost sm" href="../index.html">← 回大厅</a>
  <div class="spacer"></div>
  <button class="btn ghost sm" id="themeBtn"></button>
  <span class="tag">国际象棋</span>
</div>

<div class="wrap">
  <div class="grid2">
    <div class="panel">
      <div class="boardbox" id="boardbox">
        <canvas id="board"></canvas>
      </div>
      <div class="row" style="margin-top:13px">
        <button class="btn primary" id="newGame">新局</button>
        <button class="btn" id="hintBtn">提示</button>
        <button class="btn" id="undoBtn">悔棋</button>
        <button class="btn" id="flipBtn">翻转</button>
      </div>
      <div class="row" style="margin-top:9px">
        <span class="status" id="status"></span>
      </div>
      <div class="evalbar" style="margin-top:12px"><div class="mark" id="evalMark" style="left:50%"></div></div>
      <div class="muted" style="font-size:12px;margin-top:4px" id="evalText">局势均衡</div>
    </div>

    <div>
      <div class="tabs">
        <div class="tab active" data-tab="ctrl">对局</div>
        <div class="tab" data-tab="chat">聊天</div>
        <div class="tab" data-tab="who">对手</div>
        <div class="tab" data-tab="save">省 token</div>
        <div class="tab" data-tab="set">主题 · 接口</div>
      </div>

      <div class="panel" id="tab-ctrl">
        <div class="field"><label>模式</label>
          <select id="mode"><option value="ai">和 TA 对局</option><option value="pvp">两人轮流</option></select>
        </div>
        <div class="field"><label>棋力</label>
          <select id="diff"><option value="easy">轻松（让让你）</option><option value="medium" selected>正常</option><option value="hard">认真</option></select>
        </div>
        <div class="field"><label>你执</label>
          <select id="side"><option value="w">白（先手）</option><option value="b">黑（后手，自动翻转棋盘）</option></select>
        </div>
        <div class="field"><label>棋子样式</label>
          <select id="styleSel"><option value="glyph">符号（♛）</option><option value="disc">圆盘字母（最清楚）</option></select>
        </div>
        <div class="field"><label>升变成</label>
          <select id="promo"><option value="Q">后</option><option value="R">车</option><option value="B">象</option><option value="N">马</option></select>
        </div>
        <div class="row" style="margin-bottom:12px">
          <label class="row" style="gap:6px"><input type="checkbox" id="llmPlay"> 让大模型执子（每步约 60 token）</label>
        </div>
        <div class="panel sub">
          <h3>着法</h3>
          <div class="moves" id="moves"></div>
        </div>
        <p class="note">默认由本地引擎执子、大模型只负责说话，所以对局本身不花 token。
          棋盘支持点击选子 → 圆点是可走点、红圈是可吃子、方框是易位。</p>
      </div>

      <div class="panel hidden" id="tab-chat"><div id="chatMount"></div></div>
      <div class="panel hidden" id="tab-who"><div id="personaMount"></div></div>
      <div class="panel hidden" id="tab-save"><div id="budgetMount"></div></div>
      <div class="panel hidden" id="tab-set">
        <h3>主题</h3>
        <div id="themeMount"></div>
        <div class="divider"></div>
        <h3>模型接口</h3>
        <div id="setMount"></div>
      </div>
    </div>
  </div>
</div>

<script src="../assets/budget.js"></script>
<script src="../assets/persona.js"></script>
<script src="../assets/common.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
<script>ChessArena.bindThemeCycle(document.getElementById("themeBtn"));</script>
</body>
</html>
