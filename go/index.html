<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>围棋 · Operit 棋院</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="topbar">
  <div class="logo">Operit <span>棋院</span></div>
  <a class="btn ghost" href="../index.html">← 大厅</a>
  <div class="spacer"></div>
  <span class="tag" id="statusTag">围棋</span>
</div>

<div class="wrap">
  <div class="grid2">
    <div class="panel">
      <div class="boardbox" id="boardbox">
        <canvas id="board" width="516" height="516"></canvas>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" id="newGame">新局</button>
        <button class="btn" id="hintBtn">提示</button>
        <button class="btn" id="passBtn">停一手</button>
        <button class="btn" id="undoBtn">悔棋</button>
        <button class="btn ghost" id="resignBtn">认输</button>
        <span class="status" id="status" style="margin-left:auto"></span>
      </div>
      <div class="muted" id="capText" style="font-size:13px;margin-top:6px"></div>
    </div>

    <div>
      <div class="tabs">
        <div class="tab active" data-tab="ctrl">控制</div>
        <div class="tab" data-tab="chat">聊天</div>
        <div class="tab" data-tab="set">设置</div>
      </div>
      <div class="panel" id="tab-ctrl">
        <div class="row" style="margin-bottom:10px">
          <span class="muted">棋盘</span>
          <select id="size"><option value="19" selected>19路</option><option value="13">13路</option><option value="9">9路</option></select>
          <span class="muted">模式</span>
          <select id="mode"><option value="ai">人机</option><option value="pvp">双人</option></select>
          <span class="muted">你执</span>
          <select id="side"><option value="1">黑</option><option value="2">白</option></select>
        </div>
        <div class="row" style="margin-bottom:12px">
          <label class="row" style="gap:6px"><input type="checkbox" id="llmPlay"> 大模型执子（强对抗/讲解）</label>
        </div>
        <p class="muted" style="font-size:12px;margin-bottom:0">基础可玩版：含提子、打劫、数子（中国规则+贴目7.5）、停手。围棋强 AI 较难，建议开启「大模型执子」。</p>
      </div>
      <div class="panel hidden" id="tab-chat"><div id="chatMount"></div></div>
      <div class="panel hidden" id="tab-set"><div id="setMount"></div></div>
    </div>
  </div>
</div>

<script src="../assets/common.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
